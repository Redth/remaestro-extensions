name: validate

# `pull_request`, deliberately, and not `pull_request_target`.
#
# This workflow downloads archives chosen by whoever opened the pull request. `pull_request` runs
# with a read-only token and no access to any secret in this repository, so the index signing key
# is not reachable from a job that touches a stranger's bytes. `pull_request_target` would hand
# that job the repository's secrets, which is the shape almost every registry-CI compromise takes.
#
# Nothing here executes a submitted plugin. The archive is opened to read one file out of it.
# Starting a plugin and asking it to describe itself is a real and valuable check, and it belongs
# in an isolated runner rather than in this one.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base ref is not an optimisation. Pinned publisher keys, ids that are never
          # reassigned and versions that are never edited after publication are all properties of
          # the difference between this pull request and what was already published — none of them
          # can be checked from the working tree alone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      - name: fetch the base
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: validate
        env:
          PYTHONPATH: tools
          # A key rotation is allowed only when a maintainer has looked at it and said so with a
          # label. An account takeover and a legitimate new key are the same diff; the label is a
          # person asserting they know which one this is.
          REGISTRY_ALLOW_KEY_ROTATION: ${{ contains(github.event.pull_request.labels.*.name, 'key-rotation') && '1' || '0' }}
          # And the same shape for a publisher verification, for a closely related reason. Deciding
          # that somebody is who they say they are is a maintainer's judgement, and a submitter's
          # pull request adding their own verification record is exactly the self-claim the tier
          # exists to be immune to. A label can only be applied by somebody with write access, so it
          # is a maintainer asserting they took the decision.
          #
          # CODEOWNERS covers the same path, and the two are not redundant: this one is visible to
          # the validator and fails the run, and that one is enforced by branch protection. Neither
          # is the other's substitute.
          REGISTRY_ALLOW_VERIFICATION: ${{ contains(github.event.pull_request.labels.*.name, 'verification') && '1' || '0' }}
          # And a third, for the featured list. Same mechanism, different thing being asserted: the
          # verification label says "I decided this publisher is who they say they are", and this one
          # says "I decided this belongs in the window". The second is a smaller claim and a much more
          # tempting diff to open, which is why it needs a maintainer as much as the first does.
          #
          # Most changes here will arrive from the cloud admin console, which composes a branch and
          # opens a pull request rather than pushing — so this label and a human merge are still both
          # in the way, which is the entire reason that console opens pull requests instead of writing
          # to main.
          REGISTRY_ALLOW_CURATION: ${{ contains(github.event.pull_request.labels.*.name, 'curation') && '1' || '0' }}
        run: |
          python -m registry.validate \
            --repo . \
            --base-ref "origin/${{ github.base_ref }}"

      - name: the index still generates
        env:
          PYTHONPATH: tools
        run: python -m registry.build_index --repo . --out "$RUNNER_TEMP/index"

  tooling:
    # The validator's own tests. A rule that stops being enforced is invisible in a registry whose
    # submissions all happen to be well-formed, so the suite sabotages each rule on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tests/test_registry.py
