name: publish-index

# Regenerate the index, sign it, and publish it as the feed hubs fetch.
#
# This is the one place a signing key is used, and it signs the *index* — names, versions, URLs
# and SHA-256s. It never signs a plugin. A signature from this project over a third party's binary
# would be read as a warranty, and there is none to give; see README.md.
#
# The key lives in this repository's secrets and is read at the moment of use. It is never written
# to the workspace, never echoed, and never exported into an environment that outlives the signing
# step. The public half is committed at keys/, so anyone can check the feed for themselves.
#
# The feed is served at https://extensions.remaestro.app — a domain of ours rather than the
# github.io path, because that URL gets baked into every hub in the field and is therefore the part
# that cannot change, while the hosting behind it can. Moving off Pages later is then a DNS edit
# instead of an update every installed hub has to receive.
#
# Live since 2026-08-21: the DNS record resolves by CNAME to Pages and the custom domain is set in
# the repository's Pages settings, with HTTPS enforced. deploy-pages picks the domain up from there,
# which is why nothing here writes a CNAME — and why this comment is the only place in the workflow
# that can go stale about it. It did, for the days between the domain being configured and this line
# being read again; check the Pages settings rather than this sentence.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'publishers/**'
      - 'tools/registry/**'
      - '.github/workflows/publish-index.yml'
      # The signing key, because the index has to be re-signed when it changes and nothing else would do
      # it. This was missing, and it cost exactly what you would expect: `index-1.pub` was committed, no
      # republish ran, and every hub that fetched the feed got a 404 while the workflow's last run sat
      # green from before the key existed. A rotation is the same shape and worse — the feed would go on
      # serving signatures made with a key the field is about to stop trusting.
      - 'keys/**'
      # `verification/**` and `curation/**` are the same omission again, found while adding the second
      # of them. Both change the published documents — a tier is written into every plugin a publisher
      # has, and the featured block is written into `catalog.json` — and neither was listed, so a
      # maintainer could label, review and merge a verification and watch the feed go on saying
      # `unverified` for ever, with the last run of this workflow sitting green from an unrelated push.
      #
      # The general shape, now hit three times: **this list has to name every input `build_index.py`
      # reads**, and that is `plugins/`, `publishers/`, `verification/`, `curation/` and the generator
      # itself. Anything that changes the output and is not listed here is a merge that publishes
      # nothing and reports nothing.
      - 'verification/**'
      - 'curation/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      # Validate again on main. The pull request that merged was green against its own base; what
      # is being signed here is the tree after the merge, which is not the tree that was checked.
      - name: validate what is about to be signed
        env:
          PYTHONPATH: tools
        run: python -m registry.validate --repo . --base-ref "HEAD^"

      - name: generate
        env:
          PYTHONPATH: tools
        run: python -m registry.build_index --repo . --out index

      - name: sign
        env:
          REGISTRY_INDEX_KEY_PEM: ${{ secrets.REGISTRY_INDEX_KEY_PEM }}
        # --verify-with is not ceremony. A signature made with the wrong generation of the key
        # verifies perfectly against itself and fails on every hub in the field; the only way to
        # catch that here is to check against the public half hubs actually carry.
        run: bash tools/sign-index.sh --dir index --verify-with keys/index-1.pub

      - uses: actions/upload-pages-artifact@v3
        with:
          path: index

      - id: deploy
        uses: actions/deploy-pages@v4
